version: '3.8'

services:
  backend:
    image: <dockerhub-username>/mern-backend:1.0
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: always

  frontend:
    image: <dockerhub-username>/mern-frontend:2.0
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always