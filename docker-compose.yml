version: '3.8'

services:
  backend:
    build: ./server
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb+srv://cloud-lab:040825@cluster0.xxxx.mongodb.net/student_db?retryWrites=true&w=majority
      - PORT=5000
    restart: always

  frontend:
    build: ./client
    container_name: mern-frontend
    ports:
      - "3000:80"
    restart: always
    depends_on:
      - backend
